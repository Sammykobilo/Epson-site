<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Epson Centre offers Epson resetter programs, printer troubleshooting guides, adjustment software, and supportive resources for Epson printer maintenance.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Epson Centre | Epson Resetter & Adjustment Programs">
  <meta property="og:description" content="Epson printer troubleshooting, waste ink counter guidance, and model-specific support resources.">
  <link rel="canonical" href="https://epson-site.vercel.app/">
  <meta name="theme-color" content="#f8f6f3">
  <title>Epson Centre | Epson Resetter & Adjustment Programs</title>
  <style>
    :root {
      --bg: #f7f4f1;
      --paper: #ffffff;
      --paper-alt: #f2efe9;
      --ink: #101827;
      --muted: #5f6774;
      --line: #ded8d0;
      --accent: #c4252b;
      --accent-strong: #9f1c22;
      --hero-overlay: rgba(22, 26, 32, 0.6);
      --success: #2d7a4b;
      --shadow: 0 18px 45px rgba(16, 24, 39, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    button, input, textarea { font: inherit; }
    .container { width: min(1200px, calc(100% - 40px)); margin: 0 auto; }
    .topbar {
      background: #101213;
      color: #f3f0ed;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      padding: 10px 16px;
    }
    .topbar strong { color: #f7c8a6; }
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(247, 244, 241, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(16,24,39,.08);
    }
    .header-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 17px;
      font-weight: 700;
    }
    .brand-name {
      line-height: 1.1;
      font-size: 1.05rem;
    }
    .brand-name small {
      display: block;
      color: var(--muted);
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .main-nav {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .main-nav a:hover { color: var(--ink); }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon-button,
    .mini-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 10px;
      cursor: pointer;
      color: var(--ink);
      transition: all .2s ease;
    }
    .icon-button:hover,
    .mini-button:hover,
    .button:hover,
    .secondary-button:hover,
    .inline-button:hover {
      transform: translateY(-1px);
    }
    .icon-button {
      width: 42px;
      height: 42px;
      position: relative;
    }
    .cart-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .button,
    .secondary-button,
    .inline-button {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s ease;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .button {
      background: var(--accent);
      color: white;
      padding: 0.95rem 1.4rem;
      min-height: 48px;
    }
    .button:hover { background: var(--accent-strong); }
    .secondary-button {
      background: white;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 0.8rem 1.2rem;
      min-height: 46px;
    }
    .inline-button {
      background: var(--paper-alt);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 0.65rem 1rem;
      min-height: 40px;
      font-size: 0.8rem;
    }
    .mini-button {
      min-height: 38px;
      padding: 0.55rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .search-form {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 8px 6px 16px;
      max-width: 470px;
      width: 100%;
    }
    .search-form input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      min-width: 0;
      font-size: 0.95rem;
      color: var(--ink);
    }
    .search-form button {
      border: none;
      background: var(--accent);
      color: white;
      min-width: 46px;
      height: 42px;
      border-radius: 999px;
      cursor: pointer;
    }
    .page-shell {
      min-height: calc(100vh - 94px);
    }
    .hero {
      position: relative;
      background: linear-gradient(90deg, rgba(16,24,39,0.78), rgba(16,24,39,0.54)),
                  url('https://images.unsplash.com/photo-1581092335394-88b14f21f8cb?auto=format&fit=crop&w=1800&q=80') center/cover no-repeat;
      color: white;
      overflow: hidden;
    }
    .hero-inner {
      min-height: 0;
      display: grid;
      align-items: center;
      padding: 64px 0;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 820px);
      justify-content: center;
      align-items: center;
    }
    .hero-grid > div { width: 100%; }
    .eyebrow {
      display: inline-block;
      padding: 0.48rem 0.8rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      color: #fce3cf;
      font-weight: 700;
    }
    h1, h2, h3, h4 {
      margin: 0 0 0.8rem;
      line-height: 1.12;
      letter-spacing: -0.04em;
    }
    h1 { font-size: clamp(2.8rem, 5vw, 5rem); }
    h2 { font-size: clamp(2rem, 2.8vw, 3rem); }
    h3 { font-size: clamp(1.3rem, 2vw, 1.8rem); }
    .hero p {
      max-width: 670px;
      font-size: 1.05rem;
      color: rgba(255,255,255,.85);
      margin: 0 0 1.7rem;
    }
    .hero-search {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .hero-search input {
      flex: 1;
      min-width: 220px;
      max-width: 520px;
      height: 58px;
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 14px;
      background: rgba(255,255,255,0.1);
      color: white;
      padding: 0 1rem;
      font-size: 1rem;
      outline: none;
    }
    .hero-search input::placeholder { color: rgba(255,255,255,0.75); }
    .popular-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 0.7rem;
    }
    .pop-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,.92);
      font-size: 0.83rem;
      font-weight: 600;
    }
    .section {
      padding: 90px 0;
    }
    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 2rem;
    }
    .section-kicker {
      display: inline-block;
      margin-bottom: 0.5rem;
      color: var(--accent-strong);
      font-size: 0.76rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .text-muted { color: var(--muted); }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.25rem;
    }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.35rem;
      box-shadow: 0 4px 18px rgba(16,24,39,0.02);
    }
    .model-card {
      padding: 1.25rem;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      background: #fff3f3;
      color: var(--accent-strong);
      border: 1px solid rgba(196,37,43,0.14);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.38rem 0.7rem;
      margin-bottom: 0.9rem;
    }
    .model-card h3 {
      margin-bottom: 0.65rem;
      font-size: 1.5rem;
    }
    .model-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.96rem;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .support-grid,
    .blog-grid,
    .faq-grid,
    .info-grid,
    .cart-layout,
    .checkout-layout,
    .page-grid {
      display: grid;
      gap: 1.2rem;
    }
    .support-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .feature-card { padding: 1.4rem; }
    .feature-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #fff2f2;
      color: var(--accent-strong);
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }
    .blog-grid, .faq-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .blog-card { padding: 1.3rem; }
    .blog-card .tag { color: var(--accent-strong); font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.12em; }
    .article-date { color: var(--muted); font-size: 0.8rem; margin-top: 0.5rem; }
    .faq-item {
      border: 1px solid var(--line);
      background: white;
      border-radius: 16px;
      padding: 1rem 1.1rem;
    }
    .faq-item h4 { margin-bottom: 0.5rem; font-size: 1.05rem; }
    .faq-item p { margin: 0; color: var(--muted); }
    .faq-item .action-row { margin-top: 0.85rem; }
    .product-description-cta {
      margin: 1.75rem 0;
      padding: 1.4rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper-alt);
    }
    .product-description-cta h3 { margin-bottom: 0.4rem; }
    .product-description-cta p { color: var(--muted); margin: 0; }
    .cta {
      background: linear-gradient(135deg, #1c1d22, #2d2d34);
      color: white;
      border-radius: 24px;
      padding: 2.2rem;
    }
    .cta-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .cta p { margin: 0; color: rgba(255,255,255,.8); }
    .page-wrap {
      padding: 52px 0 90px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .breadcrumb .sep { color: #bac0ca; }
    .page-header {
      margin-bottom: 1.6rem;
    }
    .page-header p { max-width: 760px; color: var(--muted); margin: 0; }
    .product-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.7fr);
      gap: 1.5rem;
      align-items: start;
    }
    .product-summary,
    .product-side,
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 1.5rem;
    }
    .price-box {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 1rem 0 1.1rem;
      flex-wrap: wrap;
    }
    .price {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.08em;
      color: var(--ink);
    }
    .price-tag {
      background: #fff2f2;
      border: 1px solid rgba(196,37,43,0.14);
      color: var(--accent-strong);
      border-radius: 999px;
      padding: 0.45rem 0.7rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 1rem;
    }
    .big-list { margin: 1rem 0 0; padding-left: 1.2rem; color: var(--muted); }
    .big-list li { margin-bottom: 0.5rem; }
    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.1rem;
    }
    .info-box {
      background: var(--paper-alt);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem;
    }
    .info-box h4 { margin-bottom: 0.5rem; }
    .info-box p, .info-box li { color: var(--muted); }
    .pictorial-guide {
      margin: 1.75rem 0;
      padding: 1.4rem;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper-alt);
    }
    .pictorial-guide-head { margin-bottom: 1.2rem; }
    .pictorial-guide-head p { color: var(--muted); margin: 0; }
    .guide-step-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .guide-step {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
    }
    .guide-step-image {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
      background: #f8f6f3;
    }
    .guide-step-copy { padding: 1rem 1.1rem 1.15rem; }
    .guide-step-number {
      display: inline-grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: .8rem;
      font-weight: 700;
      margin-bottom: .65rem;
    }
    .guide-step-copy h4 { margin-bottom: .4rem; }
    .guide-step-copy p { color: var(--muted); margin: 0; font-size: .92rem; }
    .program-illustration {
      width: 100%;
      height: auto;
      display: block;
      margin: 1rem 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #f8f6f3;
    }
    .side-card { background: var(--paper-alt); border: 1px solid var(--line); border-radius: 18px; padding: 1rem; }
    .badge-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge-list span {
      background: white;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.42rem 0.7rem;
      font-size: 0.8rem;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }
    .list-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.2rem;
      box-shadow: 0 8px 18px rgba(16,24,39,0.02);
    }
    .list-card h3 { font-size: 1.3rem; }
    .list-card p { color: var(--muted); margin: 0; }
    .list-card .card-actions { margin-top: 1rem; }
    .result-grid {
      display: grid;
      gap: 1rem;
      margin-top: 1.25rem;
    }
    .result-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.2rem;
    }
    .result-card h3 { margin-bottom: 0.5rem; }
    .result-card p { margin: 0; color: var(--muted); }
    .empty-state {
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 18px;
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
    }
    .notice {
      background: #fff9e9;
      border: 1px solid #f5d58d;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      color: #663d00;
      font-size: 0.92rem;
      margin-top: 1.2rem;
    }
    .table-list {
      border-collapse: collapse;
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      margin-top: 1.2rem;
    }
    .table-list th, .table-list td {
      text-align: left;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    .table-list th { background: var(--paper-alt); }
    .cart-layout {
      grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.7fr);
      align-items: start;
    }
    .checkout-layout {
      grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.7fr);
      align-items: start;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
    }
    .cart-item:first-child { padding-top: 0; }
    .qty-controls {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      overflow: hidden;
      margin-top: 0.6rem;
    }
    .qty-controls button {
      width: 30px;
      height: 30px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--ink);
    }
    .qty-controls span {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
    }
    .totals {
      display: grid;
      gap: 10px;
      margin-top: 1rem;
      font-size: 0.97rem;
    }
    .totals-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
    }
    .totals-row strong { color: var(--ink); }
    footer {
      background: #111315;
      color: rgba(255,255,255,.75);
      padding: 1.5rem 0 2.2rem;
      margin-top: 2rem;
    }
    .footer-inner {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1.2fr;
      gap: 1.5rem;
    }
    .footer-inner h4 { color: white; margin-bottom: 0.8rem; }
    .footer-links {
      display: grid;
      gap: 0.5rem;
      font-size: 0.92rem;
    }
    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,.1);
      margin-top: 1.4rem;
      padding-top: 1rem;
      color: rgba(255,255,255,.65);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    @media (max-width: 980px) {
      .hero-grid,
      .products-grid,
      .support-grid,
      .footer-inner,
      .product-layout,
      .cart-layout,
      .checkout-layout,
      .grid-3,
      .grid-4,
      .blog-grid,
      .faq-grid,
      .two-col {
        grid-template-columns: 1fr 1fr;
      }
      .hero-grid { grid-template-columns: 1fr; }
      .main-nav { display: none; }
      .header-inner { gap: 10px; }
    }
    @media (max-width: 640px) {
      .container { width: min(100% - 24px, 1200px); }
      .header-inner { min-height: 72px; }
      .brand { gap: 8px; flex-shrink: 0; }
      .brand-mark { width: 36px; height: 36px; }
      .brand-name { font-size: 0.82rem; }
      .brand-name small { font-size: 0.52rem; letter-spacing: 0.14em; }
      .header-actions { flex: 1; min-width: 0; justify-content: flex-end; }
      .search-form { flex: 1; min-width: 0; max-width: none; padding-left: 10px; }
      .search-form input { width: 0; }
      .icon-button { flex-shrink: 0; }
      .hero-inner { padding: 32px 0; }
      .hero h1 { font-size: clamp(2.1rem, 10vw, 2.7rem); }
      .hero p { font-size: 0.95rem; margin-bottom: 1rem; }
      .eyebrow { padding: 0.38rem 0.65rem; margin-bottom: 0.8rem; }
      .hero-search { display: block; }
      .hero-search input { width: 100%; max-width: none; margin-bottom: 10px; }
      .popular-links { gap: 7px; margin-top: 0.4rem; }
      .pop-chip { padding: 0.45rem 0.7rem; font-size: 0.76rem; }
      .grid-3,
      .grid-4,
      .support-grid,

    function renderSearchResults() {
      const params = new URLSearchParams((window.location.hash || '').split('?')[1] || '');
      const query = (params.get('q') || '').trim();
      if (!query) return renderPrograms();

      const matches = [];
      const searchLower = query.toLowerCase();

      products.forEach((product) => {
        const haystack = `${product.model} ${product.name} ${product.description} ${product.short}`.toLowerCase();
        if (haystack.includes(searchLower)) {
          matches.push({ type: 'product', title: product.name, description: product.short, href: '#/products/' + product.slug });
        }
      });

      blogPosts.forEach((post) => {
        if ((post.title + ' ' + post.excerpt).toLowerCase().includes(searchLower)) {
          matches.push({ type: 'blog', title: post.title, description: post.excerpt, href: '/blog/' + post.slug + '/' });
        }
      });

      guides.forEach((guide) => {
        if ((guide.title + ' ' + guide.excerpt).toLowerCase().includes(searchLower)) {
          matches.push({ type: 'guide', title: guide.title, description: guide.excerpt, href: '#/guides/' + guide.slug });
        }
      });

      faqs.forEach((item) => {
        if ((item.q + ' ' + item.a).toLowerCase().includes(searchLower)) {
          matches.push({ type: 'faq', title: item.q, description: item.a, href: '#/faq' });
        }
      });

      const unique = matches.filter((match, index, arr) => arr.findIndex((entry) => entry.href === match.href && entry.title === match.title) === index);

      return `
        <div class="container page-wrap">
          <div class="breadcrumb"><a href="#/">Home</a> <span class="sep">/</span> <span>Search results</span></div>
          <div class="page-header">
            <div class="section-kicker">Search</div>
            <h1>Results for “${query}”</h1>
          </div>
          ${unique.length ? `
            <div class="result-grid">
              ${unique.map((result) => `
                <article class="result-card">
                  <div class="meta-pill">${result.type}</div>
                  <h3>${result.title}</h3>
                  <p>${result.description}</p>
                  <div class="card-actions">
                    <a class="inline-button" href="${result.href}">Open</a>
                  </div>
                </article>
              `).join('')}
            </div>
          ` : `
            <div class="empty-state">
              <h3>No matching Epson support results were found.</h3>
              <p>Try a different model number, a broader keyword, or browse all available models and programs.</p>
              <div class="card-actions" style="justify-content:center; margin-top:1rem;">
                <a class="button" href="#/models">Browse all models</a>
              </div>
            </div>
          `}
        </div>
      `;
    }

    function toggleMpesaPhone() {
      const method = document.getElementById('checkout-method');
      const field = document.getElementById('mpesa-phone-field');
      const phone = document.getElementById('checkout-phone');
      if (!method || !field || !phone) return;
      const isMpesa = method.value === 'mpesa';
      field.hidden = !isMpesa;
      phone.required = isMpesa;
    }

    async function startCheckout(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const button = document.getElementById('checkout-submit');
      const error = document.getElementById('checkout-error');
      error.hidden = true;
      button.disabled = true;
      button.textContent = 'Starting payment…';
      try {
        const data = new FormData(form);
        const response = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: data.get('name'),
            email: data.get('email'),
            method: data.get('method'),
            phone: data.get('phone'),
            items: Object.entries(state.cart).map(([slug, quantity]) => ({ slug, quantity }))
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'We could not start the payment.');
        if (result.paymentUrl) {
          window.location.assign(result.paymentUrl);
          return;
        }
        if (result.orderId) {
          setRoute('/order?order_id=' + encodeURIComponent(result.orderId));
          return;
        }
        throw new Error('The payment service did not return a valid checkout session.');
      } catch (checkoutError) {
        error.textContent = checkoutError.message;
        error.hidden = false;
        button.disabled = false;
        button.textContent = 'Continue to payment';
      }
    }

      return `
        <div class="container page-wrap">
          <div class="breadcrumb"><a href="#/">Home</a> <span class="sep">/</span> <span>Order status</span></div>
          <section class="panel" style="max-width:720px; margin:0 auto; text-align:center;">
            <div class="section-kicker">Order status</div>
            <h1>We’re checking your payment</h1>
            <p id="order-status-message" class="text-muted" role="status" aria-live="polite">Waiting for the payment provider to confirm your payment.</p>
            <p id="order-delivery-error" class="notice" hidden></p>
            <a class="secondary-button" href="#/">Return to Epson Centre</a>
          </section>
        </div>
      `;
    }

    async function pollOrderStatus() {
      const params = new URLSearchParams((window.location.hash || '').split('?')[1] || '');
      const orderId = params.get('order_id') || '';
      const message = document.getElementById('order-status-message');
      const deliveryError = document.getElementById('order-delivery-error');
      if (!message || !orderId) return;
      const startedAt = Date.now();
      while (Date.now() - startedAt < 300000 && window.location.hash.startsWith('#/order')) {
        try {
          const response = await fetch('/api/orders/' + encodeURIComponent(orderId), { cache: 'no-store' });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Unable to check order status.');
          message.textContent = result.message;
          if (result.status === 'paid' && result.deliveryStatus === 'sent') return;
          if (result.status === 'paid' && result.deliveryStatus === 'failed') {
            message.textContent = 'Payment was confirmed, but we could not send the email automatically.';
            deliveryError.textContent = 'Please contact support and include order reference ' + orderId + '.';
            deliveryError.hidden = false;
            return;
          }
        } catch (statusError) {
          message.textContent = statusError.message;
        }
        await new Promise((resolve) => setTimeout(resolve, 4000));
      }
      if (window.location.hash.startsWith('#/order')) {
        message.textContent = 'Payment is still being confirmed. You can safely wait here or return later using your order reference.';
      }
    }

    function renderPolicy(kind) {
      const policies = {
        privacy: { title: 'Privacy Policy', content: 'Epson Centre respects the privacy of visitors and customers. We collect only the information necessary to fulfill product support requests, facilitate digital delivery, and improve user experience. Personal data is not sold or shared without clear consent.' },
        terms: { title: 'Terms and Conditions', content: 'These terms govern use of the Epson Centre website and all related support resources. Users are expected to use the support information responsibly and confirm the model and product details relevant to their printer before acting.' },
        refund: { title: 'Refund Policy', content: 'Digital products are non-physical items and are generally not returned in the usual sense. Refund requests should be reviewed according to the product delivery and support circumstances described in the policy and order details.' },
        delivery: { title: 'Digital Product Delivery Policy', content: 'After the payment provider confirms a successful payment, Epson Centre emails the product archive for each purchased program to the email address entered at checkout. Archive format can vary by program. Make sure the address is accurate and can receive attachments. Delivery depends on the archive being available and email service being operational.' }
      };
      const item = policies[kind];
      return `
        <div class="container page-wrap">
          <div class="breadcrumb"><a href="#/">Home</a> <span class="sep">/</span> <span>${item.title}</span></div>
          <article class="panel" style="max-width: 900px; margin: 0 auto;">
            <div class="section-kicker">Policy</div>
            <h1>${item.title}</h1>
            <p class="text-muted">${item.content}</p>
            <h3>Important note</h3>
            <p class="text-muted">The information on this website is provided as a support and product reference. Users should verify model details and current printer conditions before using any guidance or digital resource.</p>
          </article>
        </div>
      `;
    }

    function renderNotFound() {
      return `
        <div class="container page-wrap">
          <div class="empty-state">
            <h3>We could not find that page.</h3>
            <p>The page may have moved or the route is not available in this static website build.</p>
            <div class="card-actions" style="justify-content:center; margin-top:1rem;">
              <a class="button" href="#/">Return home</a>
            </div>
          </div>
        </div>
      `;
    }

    function renderPage() {
      const route = getCurrentRoute();
      let html = '';

      switch (route) {
        case 'home': html = renderHome(); break;
        case 'programs': html = renderPrograms(); break;
        case 'models': html = renderModels(); break;
        case 'how-to-reset': html = renderTroubleshooting(); break;
        case 'troubleshooting': html = renderTroubleshooting(); break;
        case 'blog': html = renderBlogList(); break;
        case 'faq': html = renderFAQ(); break;
        case 'about': html = renderAbout(); break;
        case 'contact': html = renderContact(); break;
        case 'cart': html = renderCart(); break;
        case 'checkout': html = renderCheckout(); break;
        case 'order-status': html = renderOrderStatus(); break;
        case 'privacy': html = renderPolicy('privacy'); break;
        case 'terms': html = renderPolicy('terms'); break;
        case 'refund': html = renderPolicy('refund'); break;
        case 'delivery': html = renderPolicy('delivery'); break;
        case 'product': {
          const slug = sanitizeRoute(window.location.hash).replace('/products/', '');
          html = renderProduct(slug);
          break;
        }
        case 'blog-article': {
          const slug = sanitizeRoute(window.location.hash).replace('/blog/', '');
          html = renderBlogArticle(slug);
          break;
        }
        case 'guide': {
          const slug = sanitizeRoute(window.location.hash).replace('/guides/', '');
          html = renderGuide(slug);
          break;
        }
        case 'search': html = renderSearchResults(); break;
        default: html = renderNotFound();
      }

      document.getElementById('app').innerHTML = renderHeader() + html + `
        <footer>
          <div class="container">
            <div class="footer-inner">
              <div>
                <div class="brand" style="margin-bottom:1rem; color:white;">
                  <div class="brand-mark">E</div>
                  <div class="brand-name">Epson Centre <small>Epson Resetter</small></div>
                </div>
                <p>Support-focused Epson printer guidance, model pages, troubleshooting resources, and digital product information.</p>
              </div>
              <div>
                <h4>Pages</h4>
                <div class="footer-links">
                  <a href="#/">Home</a>
                  <a href="#/programs">Adjustment Programs</a>
                  <a href="#/models">Printer Models</a>
                  <a href="#/faq">FAQ</a>
                </div>
              </div>
              <div>
                <h4>Resources</h4>
                <div class="footer-links">
                  <a href="#/troubleshooting">Troubleshooting</a>
                  <a href="/blog/">Blog</a>
                  <a href="#/about">About Us</a>
                  <a href="#/contact">Contact Us</a>
                </div>
              </div>
              <div>
                <h4>Policies</h4>
                <div class="footer-links">
                  <a href="#/privacy">Privacy Policy</a>
                  <a href="#/terms">Terms and Conditions</a>
                  <a href="#/refund">Refund Policy</a>
                  <a href="#/delivery">Digital Product Delivery</a>
                </div>
              </div>
            </div>
            <div class="footer-bottom">
              <span>© 2026 Epson Centre</span>
              <span>Digital support pages and troubleshooting resources</span>
            </div>
          </div>
        </footer>
      `;
      updatePageMetadata(route);
      if (route === 'order-status') pollOrderStatus();
    }

    window.addEventListener('hashchange', renderPage);
    window.addEventListener('load', renderPage);
  </script>
</body>
</html>
